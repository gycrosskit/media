name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
# JVM 启动前设置；Gradle init 时 DNS 策略可能已初始化，不能在那时才改。
env:
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
concurrency:
  group: regression-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.changes.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        timeout-minutes: 5
        run: python3 scripts/ci-run.py --log ci-diagnostics/changes.log -- python3 scripts/ci-changes.py
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-changes-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  verify-public:
    if: (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify immutable archive and public Maven inventory once
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --log ci-diagnostics/verify-public.log -- bash scripts/ci-release.sh
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-verify-public-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  contracts:
    needs: changes
    if: always() && (github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.version == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful changes
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.changes.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check CI script syntax on main and docs-only changes
        timeout-minutes: 5
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-pycache" python3 scripts/ci-run.py --log ci-diagnostics/ci-syntax.log -- bash -ec 'python3 -m compileall -q scripts; for script in scripts/*.sh; do bash -n "$script"; done'
      - if: needs.changes.outputs.source == 'true'
        timeout-minutes: 5
        run: npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund typescript@4.9.5
      - if: needs.changes.outputs.source == 'true'
        timeout-minutes: 10
        run: |
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-1.log -- python3 verification/ci/test_fork_host.py
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-2.log -- python3 scripts/test-check-maven.py
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-3.log -- python3 scripts/test-jitpack-metadata.py
          TYPESCRIPT_PATH="$RUNNER_TEMP/ci-tools/node_modules/typescript" python3 scripts/ci-run.py --log ci-diagnostics/contracts-4.log -- node --test ohos/media/test/media.test.cjs
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-contracts-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  android:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 5
      - run: python3 scripts/ci-run.py --log ci-diagnostics/android-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :media-core:testDebugUnitTest :media-core:compileDebugKotlinAndroid --no-daemon --max-workers=1
        timeout-minutes: 40
      - timeout-minutes: 40
        run: |
          python3 scripts/ci-run.py --log ci-diagnostics/android-2.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-kuikly test --info --no-daemon --max-workers=1
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-android-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  native:
    needs: changes
    if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore complete Kotlin Native toolchains
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        timeout-minutes: 5
      - timeout-minutes: 40
        if: needs.changes.outputs.source == 'true'
        run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          python3 scripts/ci-run.py --log ci-diagnostics/native-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :media-core:compileKotlinIosArm64 :media-core:compileKotlin${native_target} :media-core:${native_test} :media-core:compileKotlinOhosArm64 :media-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1
          python3 - "media-core/build/test-results/$native_test" <<'TEST_RESULTS'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path(sys.argv[1]).glob('TEST-*.xml'))
          assert reports, 'Native test reports are missing; skipped target is not a pass'
          cases = [case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
          executed = [case for case in cases if case.find('skipped') is None]
          assert executed, 'No native test case executed'
          assert all(case.find('failure') is None and case.find('error') is None for case in executed)
          print(f'Native cases: {len(executed)} executed, {len(cases)-len(executed)} skipped')
          TEST_RESULTS
      - run: python3 scripts/ci-run.py --log ci-diagnostics/native-2.log -- xcrun swiftc -typecheck -target "$(uname -m)-apple-ios15.0-simulator" -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" iosApp/Sources/GycMedia/*.swift
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 10
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Save complete Kotlin Native toolchains
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-native-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-android:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 5
      - run: python3 scripts/ci-run.py --log ci-diagnostics/release-android-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer compileDebugKotlinAndroid -PmediaVersion="$VERSION" --refresh-dependencies --no-daemon --max-workers=1
        timeout-minutes: 40
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-release-android-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-native:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Identify Native toolchain and Xcode
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore complete Kotlin Native toolchains
        id: konan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - timeout-minutes: 40
        run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          python3 scripts/ci-run.py --log ci-diagnostics/release-native-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer linkDebugFramework${native_target} compileKotlinOhosArm64 -PmediaVersion="$VERSION" --refresh-dependencies --no-daemon --max-workers=1
      - name: Save complete Kotlin Native toolchains
        if: success() && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-release-native-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
