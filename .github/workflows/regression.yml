name: Bounded fork network diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 network-probe.py
        timeout-minutes: 4
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-network-proof
          path: network-proof
          retention-days: 3
